<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de personas</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <img src="/Logo-claro/logo-claro.png" alt="Claro" class="logo" />
      <h1>Gestión de personas</h1>

      <form id="person-form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" maxlength="120" required />

        <label for="puesto">Puesto:</label>
        <input type="text" id="puesto" name="puesto" maxlength="120" required />

        <button type="submit">Agregar</button>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <h2>Personas agregadas:</h2>
      <div class="actions">
        <button id="delete-all" class="small-button" type="button">Eliminar todos</button>
        <a class="button-link small-button" href="/turno.html">Ver turno</a>
      </div>
      <ul id="people-list" class="people-list"></ul>
    </main>
  </body>
</html>
