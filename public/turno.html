<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turno actual</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/turno.js" defer></script>
  </head>
  <body>
    <main class="turn-page">
      <section class="turn-card">
        <img src="/Logo-claro/logo-claro.png" alt="Claro" class="logo" />
        <div class="turn-title">TURNO ACTUAL</div>
        <div id="turn-name" class="turn-name">Cargando...</div>
        <div id="turn-position" class="turn-position"></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <div class="actions turn-actions">
          <button id="previous" type="button">⬅ Anterior</button>
          <button id="next" type="button">Siguiente ➡</button>
        </div>
        <a href="/">Volver a gestión</a>
      </section>
    </main>
  </body>
</html>
