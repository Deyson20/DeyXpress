name = "dey-turnero-claro"
main = "src/worker.js"
compatibility_date = "2026-10-23"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "turnero-claro"
database_id = "ae1bd92c-a8c5-4465-a285-e27de8c7f5f1"
migrations_dir = "migrations"
